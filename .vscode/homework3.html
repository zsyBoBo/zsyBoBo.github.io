<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>播放器图标</title>
    <style>
        /* 外层容器：大背景 */
        .player-box {
            width: 200px;
            height: 200px;
            background: #e595a3;
            border-radius: 10px;
            /* 水平+垂直居中 */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 中间黑色方框 */
        .play-inner {
            width: 100px;
            height: 100px;
            background: #c24949;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(196, 146, 146, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 播放三角形 */
        .play-triangle {
            width: 0;
            height: 0;
            /* 三角形制作：透明边框+单侧有色边框 */
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-left: 30px solid #fff;
        }
    </style>
</head>
<body>
    <div class="player-box">
        <div class="play-inner">
            <div class="play-triangle"></div>
        </div>
    </div>
</body>
</html>
