<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>网上书城注册</title>
    <style>
        /* 可根据素材补充样式 */
        .container {
            width: 500px;
            margin: 0 auto;
            border: 1px solid #ccc;
        }
        .header {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 20px;
        }
        .form-box {
            padding: 20px;
            background: #eee;
        }
        .form-item {
            margin: 10px 0;
            text-align: center;
        }
        .form-item input {
            width: 200px;
            padding: 5px;
        }
        .submit-btn {
            width: 200px;
            background: #333;
            color: #fff;
            border: none;
            padding: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">网上书城</div>
        <div class="form-box">
            <h3>+ 注册新用户</h3>
            <form action="#" method="post">
                <div class="form-item">
                    <input type="text" name="username" placeholder="用户名">
                </div>
                <div class="form-item">
                    <input type="password" name="pwd" placeholder="密码">
                </div>
                <div class="form-item">
                    <input type="password" name="repwd" placeholder="确认密码">
                </div>
                <div class="form-item">
                    <input type="email" name="email" placeholder="电子邮件">
                </div>
                <div class="form-item">
                    <input type="submit" class="submit-btn" value="注册新用户">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
