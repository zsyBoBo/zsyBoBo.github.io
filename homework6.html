<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Flex焦点轮播图</title>
    <style>
        /* 外层轮播容器 */
        .banner {
            width: 100%;
            max-width: 1200px;
            height: 320px;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        /* 左右箭头按钮 */
        .arrow {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.5);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            color: #333;
            z-index:99;
        }
        .left-arrow {
            position: absolute;
            left:20px;
        }
        .right-arrow {
            position: absolute;
            right:20px;
        }
        /* 图片盒子 */
        .img-box {
            width:100%;
            height:100%;
        }
        .img-box img {
            width:100%;
            height:100%;
            object-fit: cover;
        }
        /* 底部圆点指示器：flex横向排列居中 */
        .dot-wrap {
            position: absolute;
            bottom:20px;
            left:50%;
            transform: translateX(-50%);
            display: flex;
            gap:8px;
        }
        .dot {
            width:16px;
            height:16px;
            border-radius:50%;
            border:2px solid #fff;
        }
        .dot.active {
            background:#0099cc;
        }
    </style>
</head>
<body>
    <!-- 焦点图主体 -->
    <div class="banner">
        <!-- 左箭头 -->
        <div class="arrow left-arrow">&lt;</div>
        <!-- 轮播图片 -->
        <div class="img-box">
            <img src="222.jpg" alt="地球日海报">
        </div>
        <!-- 右箭头 -->
        <div class="arrow right-arrow">&gt;</div>
        <!-- 底部小圆点（flex布局） -->
        <div class="dot-wrap">
            <div class="dot"></div>
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
</body>
</html>
